[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loo-simulation"
version = "0.1.0"
description = "Numerical experiments for the LOO worker-firm wage project"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
estimators = [
    "pytwoway==0.3.21",
    "scipy>=1.6.1,<1.14",
]
test = [
    "pytest>=8",
]
report = [
    "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
